name: Kali Desktop (manual Selkies build)

on:
  workflow_dispatch:
    inputs:
      password:
        description: "رمز ورود"
        required: true
        default: "ChangeMe_123"

jobs:
  kali-selkies:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Start container
        run: |
          docker run -d --name kali --privileged --shm-size=1g \
            -p 8081:8081 kalilinux/kali-rolling sleep infinity

      - name: Install desktop + deps
        run: |
          docker exec kali bash -lc '
            set -e
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
              xfce4 xfce4-terminal dbus-x11 xvfb x11-utils x11-xserver-utils x11-xkb-utils \
              python3 python3-pip python3-dev jq curl ca-certificates sudo procps \
              libx11-xcb1 libxcb-dri3-0 libxkbcommon0 libxdamage1 libxfixes3 \
              libxtst6 libxext6 libpulse0 pulseaudio \
              build-essential pkg-config libudev-dev \
              libgl1-mesa-dri mesa-utils libjpeg62-turbo \
              libgstreamer1.0-0 gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
              gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly gstreamer1.0-libav
            useradd -m -s /bin/bash kali
            usermod -aG sudo kali
            echo "kali ALL=(ALL) NOPASSWD:ALL" > /etc/sudoers.d/kali
          '

      - name: Install Selkies
        run: |
          docker exec kali bash -lc '
            set -e
            WHL_URL=$(curl -fsSL https://api.github.com/repos/selkies-project/selkies/releases/latest | jq -r ".assets[] | select(.name | endswith(\".whl\")) | .browser_download_url")
            if [ -z "$WHL_URL" ]; then
              echo "Error: Could not find a .whl asset in the latest release"
              exit 1
            fi
            PIP_BREAK_SYSTEM_PACKAGES=1 pip3 install --no-cache-dir "$WHL_URL"
            echo "Checking Selkies installation..."
            which selkies-gstreamer || ls /usr/local/bin/selkies*
            selkies-gstreamer --help || true
          '

      - name: Create start script (FIXED)
        run: |
          cat > start-desktop.sh <<'SCRIPT'
          #!/bin/bash
          set -e
          
          # Log directory
          mkdir -p /tmp/logs
          
          export DISPLAY=:0
          export XDG_RUNTIME_DIR=/tmp/runtime-kali
          mkdir -p "$XDG_RUNTIME_DIR" && chmod 700 "$XDG_RUNTIME_DIR"
          export PULSE_RUNTIME_PATH="$XDG_RUNTIME_DIR/pulse"
          mkdir -p "$PULSE_RUNTIME_PATH"
          export PULSE_SERVER="unix:${PULSE_RUNTIME_PATH}/native"
          
          echo "[$(date)] Starting Xvfb..." | tee /tmp/logs/startup.log
          Xvfb :0 -screen 0 1920x1080x24 -ac -noreset -nolisten tcp \
            +extension COMPOSITE +extension DAMAGE +extension RANDR \
            +extension RENDER +extension MIT-SHM +extension XFIXES \
            +extension XTEST >> /tmp/logs/xvfb.log 2>&1 &
          XVFB_PID=$!
          echo "Xvfb PID: $XVFB_PID" >> /tmp/logs/startup.log
          
          # Wait for X server
          echo "[$(date)] Waiting for X server..." | tee -a /tmp/logs/startup.log
          for i in {1..30}; do
            if [ -S /tmp/.X11-unix/X0 ]; then
              echo "X server ready!" | tee -a /tmp/logs/startup.log
              break
            fi
            sleep 1
            if [ $i -eq 30 ]; then
              echo "ERROR: X server failed to start!" | tee -a /tmp/logs/startup.log
              exit 1
            fi
          done
          
          echo "[$(date)] Starting PulseAudio..." | tee -a /tmp/logs/startup.log
          pulseaudio --disallow-exit --exit-idle-time=-1 \
            --log-target=file:/tmp/logs/pulseaudio.log 2>&1 &
          PULSE_PID=$!
          echo "PulseAudio PID: $PULSE_PID" >> /tmp/logs/startup.log
          sleep 2
          
          echo "[$(date)] Starting D-Bus and XFCE..." | tee -a /tmp/logs/startup.log
          dbus-launch --exit-with-session startxfce4 >> /tmp/logs/xfce.log 2>&1 &
          XFCE_PID=$!
          echo "XFCE PID: $XFCE_PID" >> /tmp/logs/startup.log
          sleep 5
          
          echo "[$(date)] Starting Selkies GStreamer..." | tee -a /tmp/logs/startup.log
          selkies-gstreamer \
            --addr=0.0.0.0 \
            --port=8081 \
            --basic-auth "kali:${DESKTOP_PASSWORD}" \
            --encoder=jpeg \
            --framerate=30 \
            --enable-resize \
            >> /tmp/logs/selkies.log 2>&1 &
          SELKIES_PID=$!
          echo "Selkies PID: $SELKIES_PID" >> /tmp/logs/startup.log
          
          echo "[$(date)] All services started, monitoring..." | tee -a /tmp/logs/startup.log
          
          # Monitor processes
          wait -n 2>/dev/null || true
          
          echo "[$(date)] A service crashed!" >> /tmp/logs/startup.log
          SCRIPT
          chmod +x start-desktop.sh
          docker cp start-desktop.sh kali:/opt/start-desktop.sh
          docker exec kali chown kali:kali /opt/start-desktop.sh

      - name: Launch desktop (FIXED)
        run: |
          docker exec -u kali kali bash -c 'export DESKTOP_PASSWORD="${{ inputs.password }}" && /opt/start-desktop.sh' &
          
          echo "Script started..."
          sleep 15
          
          SUCCESS=0
          for i in {1..60}; do
            echo "Attempt $i/60: Checking Selkies..."
            
            if curl -fsS -o /dev/null http://localhost:8081 2>/dev/null; then
              echo "✓ Selkies is running on port 8081"
              SUCCESS=1
              break
            fi
            
            if ! docker exec kali pgrep -f selkies-gstreamer > /dev/null 2>&1; then
              echo "✗ Selkies process died!"
              break
            fi
            
            sleep 5
          done
          
          if [ $SUCCESS -eq 0 ]; then
            echo "Error: Selkies failed to start!"
            echo "=== STARTUP LOG ==="
            docker exec kali cat /tmp/logs/startup.log 2>/dev/null || echo "Not found"
            echo "=== XVFB LOG ==="
            docker exec kali cat /tmp/logs/xvfb.log 2>/dev/null || echo "Not found"
            echo "=== PULSEAUDIO LOG ==="
            docker exec kali cat /tmp/logs/pulseaudio.log 2>/dev/null || echo "Not found"
            echo "=== XFCE LOG ==="
            docker exec kali cat /tmp/logs/xfce.log 2>/dev/null || echo "Not found"
            echo "=== SELKIES LOG ==="
            docker exec kali cat /tmp/logs/selkies.log 2>/dev/null || echo "Not found"
            echo "=== PROCESS LIST ==="
            docker exec kali ps aux || echo "Not found"
            exit 1
          fi

      - name: Install cloudflared
        run: |
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o cloudflared
          chmod +x cloudflared && sudo mv cloudflared /usr/local/bin/cloudflared

      - name: Start tunnel
        run: |
          nohup cloudflared tunnel --no-autoupdate --url http://localhost:8081 > tunnel.log 2>&1 &
          URL=""
          for i in $(seq 1 40); do
            URL=$(grep -Eo 'https://[a-zA-Z0-9-]+\.trycloudflare\.com' tunnel.log | head -n1 || true)
            [ -n "$URL" ] && break
            sleep 3
          done
          echo "::notice title=Kali Desktop::${URL:-not-found}"
          echo "URL: $URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Keep alive
        run: sleep 20000
