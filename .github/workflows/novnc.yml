name: Kali Desktop (manual Selkies build)

on:
  workflow_dispatch:
    inputs:
      password:
        description: "رمز ورود"
        required: true
        default: "ChangeMe_123"

jobs:
  kali-selkies:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Start container
        run: |
          docker run -d --name kali --privileged --shm-size=1g \
            -p 8081:8081 kalilinux/kali-rolling sleep infinity

      - name: Install desktop + deps
        run: |
          docker exec kali bash -lc '
            set -e
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
              xfce4 xfce4-terminal dbus-x11 xvfb x11-utils x11-xserver-utils x11-xkb-utils \
              python3 python3-pip python3-dev jq curl ca-certificates sudo procps \
              libx11-xcb1 libxcb-dri3-0 libxkbcommon0 libxdamage1 libxfixes3 \
              libxtst6 libxext6 libpulse0 pulseaudio \
              build-essential pkg-config libudev-dev \
              libgl1-mesa-dri mesa-utils libjpeg62-turbo
            useradd -m -s /bin/bash kali
            usermod -aG sudo kali
            echo "kali ALL=(ALL) NOPASSWD:ALL" > /etc/sudoers.d/kali
          '

      - name: Install Selkies
        run: |
          docker exec kali bash -lc '
            set -e
            WHL_URL=$(curl -fsSL https://api.github.com/repos/selkies-project/selkies/releases/latest | jq -r ".assets[] | select(.name | endswith(\".whl\")) | .browser_download_url")
            if [ -z "$WHL_URL" ]; then
              echo "Error: Could not find a .whl asset in the latest release"
              exit 1
            fi
            PIP_BREAK_SYSTEM_PACKAGES=1 pip3 install --no-cache-dir "$WHL_URL"
            # بررسی صحت نصب
            selkies --version
          '

      - name: Create start script
        run: |
          cat > start-desktop.sh <<'SCRIPT'
          #!/bin/bash
          set -x
          export DISPLAY=:0
          export XDG_RUNTIME_DIR=/tmp/runtime-kali
          mkdir -p "$XDG_RUNTIME_DIR" && chmod 700 "$XDG_RUNTIME_DIR"
          export PULSE_RUNTIME_PATH="$XDG_RUNTIME_DIR/pulse"
          export PULSE_SERVER="unix:${PULSE_RUNTIME_PATH}/native"

          Xvfb :0 -screen 0 1920x1080x24 -ac -noreset -nolisten tcp \
            +extension COMPOSITE +extension DAMAGE +extension RANDR \
            +extension RENDER +extension MIT-SHM +extension XFIXES \
            +extension XTEST > /tmp/xvfb.log 2>&1 &

          until [ -S /tmp/.X11-unix/X0 ]; do sleep 0.5; done

          pulseaudio --disallow-exit --exit-idle-time=-1 \
            --log-target=file:/tmp/pulseaudio.log > /dev/null 2>&1 &
          sleep 2

          dbus-launch --exit-with-session startxfce4 > /tmp/xfce.log 2>&1 &
          sleep 5

          # راه‌اندازی Selkies با ثبت خروجی
          echo "Starting Selkies..."
          exec selkies \
            --addr=0.0.0.0 \
            --port=8081 \
            --basic-auth-user=kali \
            --basic-auth-password="$DESKTOP_PASSWORD" \
            --encoder=jpeg \
            --framerate=30 \
            --enable-resize=true \
            > /tmp/selkies.log 2>&1
          SCRIPT
          chmod +x start-desktop.sh
          docker cp start-desktop.sh kali:/opt/start-desktop.sh
          docker exec kali chown kali:kali /opt/start-desktop.sh

      - name: Launch desktop
        run: |
          # اجرای اسکریپت در بک‌گراند با لاگ جداگانه
          docker exec -d -u kali -e DESKTOP_PASSWORD='${{ inputs.password }}' \
            kali /opt/start-desktop.sh

          # انتظار برای بالا آمدن پورت یا تشخیص خطا
          SUCCESS=0
          for i in $(seq 1 60); do
            if curl -fsS -o /dev/null http://localhost:8081 2>/dev/null; then
              echo "Selkies is up and running on port 8081"
              SUCCESS=1
              break
            fi
            # اگر فرایند Selkies وجود نداشت، زودتر خطا بده
            if ! docker exec kali pgrep -f selkies > /dev/null 2>&1; then
              echo "Selkies process died. Checking logs..."
              break
            fi
            sleep 5
          done

          if [ $SUCCESS -eq 0 ]; then
            echo "Error: Selkies failed to start. Dumping logs:"
            echo "=== XVFB LOG ==="
            docker exec kali cat /tmp/xvfb.log || true
            echo "=== PULSEAUDIO LOG ==="
            docker exec kali cat /tmp/pulseaudio.log || true
            echo "=== XFCE LOG ==="
            docker exec kali cat /tmp/xfce.log || true
            echo "=== SELKIES LOG ==="
            docker exec kali cat /tmp/selkies.log || true
            exit 1
          fi

      - name: Install cloudflared
        run: |
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o cloudflared
          chmod +x cloudflared && sudo mv cloudflared /usr/local/bin/cloudflared

      - name: Start tunnel
        run: |
          nohup cloudflared tunnel --no-autoupdate --url http://localhost:8081 > tunnel.log 2>&1 &
          URL=""
          for i in $(seq 1 40); do
            URL=$(grep -Eo 'https://[a-zA-Z0-9-]+\.trycloudflare\.com' tunnel.log | head -n1 || true)
            [ -n "$URL" ] && break
            sleep 3
          done
          echo "::notice title=Kali Desktop::${URL:-not-found}"
          echo "URL: $URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Keep alive
        run: sleep 20000
